name: Docker image
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["Dockerfile", "docker/**", "package*.json", "src/**", ".github/workflows/docker.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: chatgpt-web-mcp:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: docker image inspect chatgpt-web-mcp:smoke --format 'uncompressed={{.Size}}' && docker save chatgpt-web-mcp:smoke | gzip -1 | wc -c | awk '{printf "compressed~=%.0f MB\n", $1/1048576}'
      - name: Headful Chromium starts under Xvfb
        run: |
          docker run --rm chatgpt-web-mcp:smoke node -e "require('playwright-core').chromium.launch({headless:false}).then(async b=>{const p=await b.newPage();await p.setContent('<h1>ok</h1>');console.log('chromium', b.version(), await p.textContent('h1'));await b.close()}).catch(e=>{console.error(e);process.exit(1)})"
      - name: Server answers /healthz
        run: |
          docker run -d --name s -p 8099:8099 chatgpt-web-mcp:smoke
          for i in $(seq 1 30); do curl -fsS localhost:8099/healthz && exit 0; sleep 1; done
          docker logs s; exit 1

  image:
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
